<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>সদস্য খোঁজ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f6f5; --surface:#ffffff; --ink:#15262a; --muted:#587076; --line:#d3dedc;
  --accent:#0a6b6b; --danger:#b3261e; --warn:#b26a00; --accent-ink:#ffffff; --tab:#e2efed; --mark:#ffe58a; --focus:#0a6b6b;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1a1c; --surface:#152326; --ink:#e5eeed; --muted:#9bb0b3; --line:#294045;
    --accent:#5cc7bc; --danger:#ff8a80; --warn:#ffb74d; --accent-ink:#05211f; --tab:#1d3438; --mark:#6d5c05; --focus:#5cc7bc;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1a1c; --surface:#152326; --ink:#e5eeed; --muted:#9bb0b3; --line:#294045;
  --accent:#5cc7bc; --danger:#ff8a80; --warn:#ffb74d; --accent-ink:#05211f; --tab:#1d3438; --mark:#6d5c05; --focus:#5cc7bc;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 150px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans Bengali","Hind Siliguri","Kalpurush","Nirmala UI","Vrinda",system-ui,sans-serif;
  font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:900px;margin:0 auto;padding:0 14px 40px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);padding:14px 0 10px;border-bottom:1px solid var(--line)}
h1{margin:0;font-size:24px;line-height:1.3;font-weight:700}
.sub{margin:2px 0 12px;color:var(--muted);font-size:15px}
.sbox{position:relative}
.sbox input{width:100%;height:56px;font:inherit;font-size:18px;color:var(--ink);background:var(--surface);
  border:2px solid var(--accent);border-radius:12px;padding:0 52px 0 16px;appearance:none;-webkit-appearance:none}
.sbox input::placeholder{color:var(--muted)}
.sbox input::-webkit-search-cancel-button{display:none}
.clear{position:absolute;right:6px;top:6px;width:44px;height:44px;border:0;border-radius:10px;background:none;color:var(--muted);font-size:26px;line-height:1;cursor:pointer}
.clear[hidden]{display:none}
input:focus-visible,button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.hint{margin:8px 0 0;color:var(--muted);font-size:14px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.chip{font:inherit;font-size:15px;min-height:40px;padding:0 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.sort{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:15px;color:var(--muted)}
.sort select{font:inherit;font-size:15px;min-height:40px;padding:0 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.count{margin:14px 2px 8px;color:var(--muted);font-size:15px}
ul.list{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.m{display:grid;grid-template-columns:1fr auto;border-bottom:1px solid var(--line)}
.m:last-child{border-bottom:0}
.head{display:grid;grid-template-columns:78px 1fr;gap:14px;align-items:stretch;text-align:left;width:100%;
  font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.no{background:var(--tab);color:var(--accent);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px 4px;font-size:26px;font-weight:700;line-height:1.1}
.no small{font-size:12px;font-weight:500;color:var(--muted);margin-bottom:4px;line-height:1.2}
.who{padding:12px 0;display:flex;flex-direction:row;align-items:center;gap:12px;min-width:0}
.tx{display:flex;flex-direction:column;gap:2px;min-width:0}
.who b{font-size:18px;font-weight:600;line-height:1.4}
.ad{color:var(--muted);font-size:15px;line-height:1.5}
.life{display:inline-block;align-self:flex-start;margin-top:4px;font-size:13px;color:var(--accent);border:1px solid var(--accent);border-radius:6px;padding:0 8px;line-height:1.6}
.phones{display:flex;flex-direction:column;gap:6px;justify-content:center;padding:10px 14px}
.call{display:inline-block;padding:7px 12px;border:1px solid var(--line);border-radius:8px;color:var(--accent);text-decoration:none;font-weight:500;white-space:nowrap;font-variant-numeric:tabular-nums}
.nop{color:var(--muted);font-size:14px}
.more{grid-column:1/-1;padding:2px 16px 16px 92px;border-top:1px dashed var(--line)}
.more[hidden]{display:none}
dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;margin:12px 0}
dt{color:var(--muted);font-size:15px}
dd{margin:0}
.cp{font:inherit;font-size:15px;min-height:40px;padding:0 14px;border:1px solid var(--accent);border-radius:8px;background:none;color:var(--accent);cursor:pointer}
.pic{flex:none;width:52px;height:52px;border-radius:8px;background:var(--tab);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:22px;overflow:hidden}
.pic img{width:100%;height:100%;object-fit:cover}
.big{width:120px;height:120px;border-radius:10px;object-fit:cover;display:block;margin-top:12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btn{font:inherit;font-size:15px;min-height:40px;padding:0 14px;border:1px solid var(--accent);border-radius:8px;background:var(--accent);color:var(--accent-ink);cursor:pointer;font-weight:600}
.btn.ghost{background:none;color:var(--accent)}
.btn.warn{background:none;color:var(--danger);border-color:var(--danger)}
.btn:disabled{opacity:.6}
dialog{width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:18px;font:inherit}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog h2{margin:0 0 12px;font-size:20px}
dialog p{margin:6px 0}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fg label{display:flex;flex-direction:column;gap:2px;font-size:14px;color:var(--muted)}
.fg label.w{grid-column:1/-1}
.fg input,.fg select{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:42px}
.fg input[type=checkbox]{min-height:0;width:20px;height:20px;vertical-align:middle}
.msg{font-size:15px;color:var(--muted)}
.lock{padding:48px 8px;text-align:center}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
.empty{padding:28px 18px;text-align:center;color:var(--muted)}
.rs{margin:0 0 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 14px 6px}
.rs summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:600}
.rs table{width:100%;border-collapse:collapse;margin:2px 0 8px}
.rs th,.rs td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right}
.rs th:first-child,.rs td:first-child{text-align:left}
.pdfpage{position:fixed;left:-10000px;top:0;width:794px;min-height:600px;padding:28px 32px;background:#fff;color:#000;font-size:13pt;line-height:1.5}
.pdfpage.land{width:1123px}
.pdfpage.land table{table-layout:fixed}
.pdfpage.land td,.pdfpage.land th{line-height:1.25;padding:2px 5px}
.pdfpage .mp{width:50px;height:62px;object-fit:cover;display:block;margin:0 auto}
.pdfpage h2{margin:0 0 4px;font-size:18pt}
.sec1 td{background:#d9d9d9;font-weight:700}
.sec2 td{background:#efefef;font-weight:600}
.pdfpage p{margin:0 0 10px}
.pdfpage table{width:100%;border-collapse:collapse}
.pdfpage th,.pdfpage td{border:1px solid #444;padding:4px 6px;text-align:left;vertical-align:top}
.pdfpage .pvp{width:110px;height:110px;object-fit:cover;float:right}
.pdfpage td{font-size:13pt}
#pv,.pdfpage{font-family:var(--pf,"Noto Sans Bengali","Hind Siliguri","Kalpurush","Nirmala UI","Vrinda",system-ui,sans-serif)}
.pdfpage th{font-size:13pt}
.pdfpage .sec1 td{font-size:13pt}
.pdfpage .sec2 td{font-size:13pt}
.pdfpage td.c{text-align:center;vertical-align:middle}
.pdfpage .pg{text-align:center;color:#555;font-size:10pt;margin-top:10px}
.pgin{display:flex;flex-direction:column;gap:2px;font-size:14px;color:var(--muted);margin-top:8px}
.pgin input{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:42px}
.pgl{max-height:170px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:4px 10px;margin:8px 0;font-size:14px;color:var(--muted)}
.pgl p{margin:4px 0}
.docimg{max-width:100%;max-height:70vh;display:block;margin:8px auto;border:1px solid var(--line)}
.docpg{width:100%;height:auto;display:block;margin:8px 0;border:1px solid var(--line);background:#fff}
.docfr{width:100%;height:60vh;border:1px solid var(--line)}
.brand{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:12px}
.bt{text-align:center}
.bt .sub{margin:2px 0 0}
.logo{height:52px;width:auto;max-width:90px;object-fit:contain}
.logo[hidden]{display:none}
.hd{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:8px}
.ht{text-align:center}
.ht p{margin:0;font-size:16pt}
.hd .lg{height:54px;width:auto;max-width:100px;object-fit:contain}
#pv thead th,.pdfpage thead th{text-align:center}
#pvw{width:min(1040px,calc(100vw - 12px));max-height:calc(100dvh - 12px);padding:10px;background:var(--bg)}
.pvbar{position:sticky;top:-10px;z-index:2;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 0;background:var(--bg)}
.pvbar span{color:var(--muted);font-size:14px;flex:1;min-width:140px}
.shw{overflow:hidden;margin:0 auto 12px;box-shadow:0 1px 8px rgba(0,0,0,.4)}
.shw.over{outline:3px solid var(--danger)}
.pdfpage.sheet{position:relative;left:0;top:0;margin:0}
.tagd{color:var(--danger);border-color:var(--danger);margin-left:6px}
.pgin textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:60px}
.m.dead{background:rgba(179,38,30,.08);box-shadow:inset 4px 0 0 var(--danger)}
.m.dead .no{color:var(--danger)}
.m.nvr{box-shadow:inset 4px 0 0 var(--warn)}
.tagw{color:var(--warn);border-color:var(--warn)}
.fg textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:70px}
.qres{max-height:220px;overflow:auto;margin:8px 0}
.qres p{margin:4px 0;font-size:15px}
.qres .bad{color:var(--danger)}
.ht p.ad2{font-size:13pt;font-weight:700;margin:2px 0 0}
.ht p.tb{display:inline-block;border:2px solid #000;border-radius:12px;padding:6px 24px;font-weight:700;font-size:16pt;margin:8px 0 4px}
.tabs{display:flex;gap:8px;margin:0 0 10px}
.tabs .chip{flex:1;font-weight:600}
#pv{display:none}
@media print{
  @page{margin:12mm}
  @page land{size:A4 landscape;margin:7mm}
  .pvpage.land{page:land}
  #pv .land table{table-layout:fixed}
  #pv .land td,#pv .land th{line-height:1.25;padding:2px 5px}
  #pv .mp{width:50px;height:62px;object-fit:cover;display:block;margin:0 auto}
  body{background:#fff;color:#000}
  body::before,.wrap,dialog{display:none!important}
  #pv{display:block;color:#000;font-size:13pt}
  #pv h2{margin:0 0 4px;font-size:18pt}
  #pv p{margin:0 0 10px}
  #pv table{width:100%;border-collapse:collapse}
  #pv th,#pv td{border:1px solid #444;padding:4px 6px;text-align:left;vertical-align:top}
  #pv thead{display:table-header-group}
  #pv tr{break-inside:avoid}
  .pvpage{break-after:page;page-break-after:always}
  .pvpage:last-child{break-after:auto;page-break-after:auto}
  #pv .pg{text-align:center;color:#555;font-size:10pt;margin-top:8px}
  #pv td{font-size:13pt}
  #pv th{font-size:13pt}
  #pv .sec1 td{font-size:13pt}
  #pv .sec2 td{font-size:13pt}
  #pv td.c{text-align:center;vertical-align:middle}
  .pvp{width:110px;height:110px;object-fit:cover;float:right}
}
.empty button{margin-top:10px}
@media (max-width:600px){
  .fg{grid-template-columns:1fr}
  h1{font-size:21px}
  .m{grid-template-columns:1fr}
  .phones{flex-direction:row;flex-wrap:wrap;padding:0 14px 12px 92px}
  .more{padding-left:16px}
  .sort{margin-left:0;width:100%}
  .sort select{flex:1}
}
@media (prefers-reduced-motion:no-preference){ .more:not([hidden]){animation:open .15s ease-out} }
@keyframes open{from{opacity:0}to{opacity:1}}
</style>

<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><img id="logo" class="logo" alt="" hidden><div class="bt"><h1>নাসিরাবাদ হাউজিং সোসাইটি কল্যাণ পরিষদ</h1><p class="sub">সদস্য তালিকা ২০২৩-২৪</p></div></div>

      <input id="q" type="search" enterkeyhint="search" autocomplete="off" autocapitalize="off" spellcheck="false"
        placeholder="নাম, সদস্য নং, মোবাইল বা বিল্ডিং লিখুন" aria-label="সদস্য খুঁজুন">
      <button class="clear" id="clr" type="button" aria-label="লেখা মুছুন" hidden>×</button>
    </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
const BN = "০১২৩৪৫৬৭৮৯";
const toEn = s => String(s).replace(/[০-৯]/g, c => String(BN.indexOf(c)));
const toBn = s => String(s).replace(/[0-9]/g, d => BN[d]);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const FOLD = {"ী":"ি","ূ":"ু","ণ":"ন","শ":"স","ষ":"স","ঁ":"","\u200c":"","\u200d":"","়":"","ঃ":""};
function foldMap(s){
  let t = "", m = [];
  for (let i = 0; i < s.length; i++){
    let c = s[i];
    const d = BN.indexOf(c);
    if (d >= 0) c = String(d);
    else if (Object.prototype.hasOwnProperty.call(FOLD, c)) c = FOLD[c];
    else c = c.toLowerCase();
    for (const ch of c){ t += ch; m.push(i); }
  }
  return {t, m};
}
const fold = s => foldMap(s || "").t;
const TITLES = /^(জনাব|মিসেস|মিস|মিসস|আলহাজ্ব|হাজী|ডাঃ|ডা\.|ডা:|ডা|অধ্যাপক|প্রকৌশলী|এডভোকেট|ক্যাপ্টেন|কেপ্টেন|মোঃ|মো:|মোহাম্মদ|মুহাম্মদ|মোহাম্মাদ|মোছাম্মৎ|মোছাম্মদ|\s)+/;
const mkRow = r => {
  const houseNums = (toEn(r.h).match(/\d+/g) || []).map(Number);
  return Object.assign({}, r, {
    f_: {name: fold(r.nm), father: fold(r.f), mother: fold(r.m), bld: fold(r.b), job: fold(r.j), age: fold(r.a), flat: fold(r.fl), email: fold(r.e || ""), na: fold(r.na || "")},
    phones: r.p.join(" "),
    noN: parseInt(toEn(r.n), 10),
    roadN: parseInt(toEn(r.r), 10),
    houseNums: houseNums,
    houseF: fold(r.h),
    key: r.nm.replace(TITLES, "")
  });
};
let rows = [];
const ROADS = ["০১","০২","০৩","০৪","০৫","০৬"];
const BADI = "বাড\u09bf", ROAD = "রোড";
const state = {q: "", road: "", life: "", st: "", sort: "rel", open: new Set(), view: "m", hsort: "hn", hb: "1", gopen: new Set()};

function parseQuery(q){
  let t = fold(q).replace(/[,;|]+/g, " ");
  const cond = {};
  t = t.replace(new RegExp(ROAD + "\\s*(?:নং)?\\s*[-:]?\\s*(\\d+)", "g"), (m, d) => { cond.road = parseInt(d, 10); return " "; });
  t = t.replace(new RegExp("(?:" + BADI + "|বাসা)\\s*(?:নং)?\\s*[-:]?\\s*(\\d+)", "g"), (m, d) => { cond.house = parseInt(d, 10); return " "; });
  t = t.replace(new RegExp("(?:সদস্য|মেম্বার)\\s*(?:নং)?\\s*[-:]?\\s*(\\d+)", "g"), (m, d) => { cond.no = parseInt(d, 10); return " "; });
  const tokens = t.split(/\s+/).filter(Boolean).map(x => /^[\d-]+$/.test(x) ? x.replace(/-/g, "") : x).filter(Boolean);
  return {tokens, cond};
}
function tokenScore(r, tk){
  const f = r.f_;
  if (/^\d+$/.test(tk)){
    if (tk.length >= 4){
      if (r.phones.includes(tk)) return 60;
      if (f.age.includes(tk)) return 20;
      return 0;
    }
    const v = parseInt(tk, 10);
    if (r.noN === v) return 100;
    if (r.houseNums[0] === v) return 30;
    if (f.flat.includes(tk)) return 5;
    return 0;
  }
  if (f.name.split(" ").some(w => w.startsWith(tk))) return 40;
  if (f.name.includes(tk)) return 30;
  if (f.bld.includes(tk)) return 15;
  if (f.father.includes(tk) || f.mother.includes(tk)) return 12;
  if (f.job.includes(tk)) return 10;
  if (f.flat.includes(tk) || r.houseF.includes(tk)) return 8;
  if (f.email.includes(tk)) return 9;
  if (f.na.includes(tk)) return 6;
  return 0;
}
function run(){
  const {tokens, cond} = parseQuery(state.q);
  const only = tokens.length === 1 && /^\d{1,3}$/.test(tokens[0]) && cond.no == null && cond.road == null && cond.house == null ? parseInt(tokens[0], 10) : null;
  const exact = only != null && rows.some(r => r.noN === only);
  const out = [];
  for (const r of rows){
    if (exact && r.noN !== only) continue;
    if (state.road && r.r !== state.road) continue;
    if (state.life === "l" && !r.l) continue;
    if (state.life === "g" && r.l) continue;
    if (!stOk(r, state.st)) continue;
    if (cond.road != null && r.roadN !== cond.road) continue;
    if (cond.house != null && r.houseNums[0] !== cond.house) continue;
    if (cond.no != null && r.noN !== cond.no) continue;
    let score = 0, ok = true;

function hl(text, tokens, phone){
  text = String(text || "");
  if (!tokens.length) return esc(text);
  let {t, m} = foldMap(text);
  if (phone){
    const t2 = [], m2 = [];
    for (let i = 0; i < t.length; i++) if (t[i] !== "-"){ t2.push(t[i]); m2.push(m[i]); }
    t = t2.join(""); m = m2;
  }
  const marks = new Array(text.length).fill(false);
  for (const tk of tokens){
    if (!tk) continue;
    let from = 0;
    for (;;){
      const k = t.indexOf(tk, from);
      if (k < 0) break;
      for (let j = k; j < k + tk.length; j++) marks[m[j]] = true;
      from = k + tk.length;
    }
  }
  let out = "", on = false;
  for (let i = 0; i < text.length; i++){
    if (marks[i] && !on){ out += "<mark>"; on = true; }
    if (!marks[i] && on){ out += "</mark>"; on = false; }
    out += esc(text[i]);
  }
  return on ? out + "</mark>" : out;
}

function layoutSeq(d, hs, cap){
  const rows = [], brk = [0], seq = d.seq, hG = new Map();
  let used = 0, curG = null, curS = null, curSh = 0;
  seq.forEach((it, i) => { if (it.k === "g") hG.set(it.g, hs[i]); });
  const push = (r, h) => { rows.push(r); used += h; };
  const flush = () => { if (rows.length > brk[brk.length - 1]) brk.push(rows.length); used = 0; };
  for (let i = 0; i < seq.length; i++){
    const it = seq[i], h = hs[i];
    if (it.k === "g"){
      const nx = seq[i + 1], need = h + hs[i + 1] + (nx && nx.k === "s" ? hs[i + 2] : 0);
      if (used + need > cap) flush();
      curG = it.g; curS = null; push(d.mk1(it.g, false), h);
    } else if (it.k === "s"){
      if (seq[i - 1].k === "m" && used + h + hs[i + 1] > cap){ flush(); push(d.mk1(curG, true), hG.get(curG)); }
      curS = it.t; curSh = h; push(d.mk2(it.t, false), h);
    } else {
      if (used + h > cap){ flush(); push(d.mk1(curG, true), hG.get(curG)); if (curS) push(d.mk2(curS, true), curSh); }
      push(it.row, h);
    }
  }
  const pgl = brk.map((st, i) => {
    const seg = rows.slice(st, brk[i + 1] === undefined ? rows.length : brk[i + 1]).filter(r => r.sec === 1), a = seg[0], b = seg[seg.length - 1];
    return a ? "রোড " + a.g.road + ", " + a.g.name + (b !== a ? " থেকে রোড " + b.g.road + ", " + b.g.name : "") : "";
  });
  return {rows: rows, brk: brk, pgl: pgl};
}

async function fitDoc(d){

    box.innerHTML = docHtml(d, flat, true, 1, 2);

}

    const pg = await pdf.getPage(i), v0 = pg.getViewport({scale: 1});

    const cv = document.createElement("canvas"); cv.className = "docpg"; cv.width = Math.floor(vp.width); cv.height = Math.floor(vp.height);
    await pg.render({canvasContext: cv.getContext("2d"), viewport: vp}).promise;
    dv.appendChild(cv);
  }
  return pdf.numPages > max ? "প্রথম ১০ পৃষ্ঠা দেখানো হয়েছে, পুরোটা দেখতে ডাউনলোড করুন।" : "";

    onSnapshot: (fn) => {
      db._cb[name] = () => {
        const data = db._get(name, name === "settings" ? { org: { addr: DEFADDR, logo: "" } } : {});
        const docs = Object.keys(data).map(id => ({ id, data: () => data[id] }));
        fn({ docs, forEach: cb => docs.forEach(cb) });
      };
      db._cb[name]();
    },
    orderBy: () => ({
      limit: () => ({
        get: async () => {
          const arr = db._get("audit", []);
          return { docs: arr.map((x, i) => ({ id: String(i), data: () => x })) };
        }
      })
    }),
    add: async (item) => {
      const arr = db._get("audit", []);
      arr.unshift(item);
      db._set("audit", arr.slice(0, 200));
    }
  }),
  doc: (path) => ({
    get: async () => {
      const [col, id] = path.split("/");
      const all = db._get(col, {});
      return { exists: !!all[id], data: () => all[id] };
    },
    set: async (patch, opt) => {
      const [col, id] = path.split("/");
      const all = db._get(col, {});
      if (opt && opt.merge) all[id] = Object.assign(all[id] || {}, patch);
      else all[id] = patch;
      db._set(col, all);
    },
    update: async (patch) => {
      const [col, id] = path.split("/");
      const all = db._get(col, {});
      all[id] = all[id] || {};
      Object.keys(patch).forEach(k => {
        if (patch[k] === null) delete all[id][k];
        else all[id][k] = patch[k];
      });
      db._set(col, all);
    }
  })
};

const origFetch = window.fetch;
window.fetch = async function(url, opts) {
  if (typeof url === "string" && url.startsWith("/_blob/data:")) {
    const d = url.slice(7).split(",");
    const mime = d.at(0).match(/:(.*?);/).at(1);
    const bstr = atob(d.at(1));
    let n = bstr.length, u8 = new Uint8Array(n);
    while (n--) u8[n] = bstr.charCodeAt(n);
    return new Response(new Blob([u8], { type: mime }));
  }
  return origFetch.apply(this, arguments);
};
 
shrink = async function(file) {

  const bmp = await createImageBitmap(file);
  const k = Math.min(1, 900 / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas");
  c.width = Math.round(bmp.width * k);
  c.height = Math.round(bmp.height * k);
  const ctx = c.getContext("2d");
  ctx.drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise(res => c.toBlob(res, "image/jpeg", 0.96));
};

function toSutonnyStr(s) {
  const u2b = {"০":"0","১":"1","২":"2","৩":"3","৪":"4","৫":"5","৬":"6","৭":"7","৮":"8","৯":"9","আ":"Av","অ":"A","ই":"B","ঈ":"C","উ":"D","ঊ":"E","ঋ":"F","এ":"G","ঐ":"H","ও":"I","ঔ":"J","ক":"K","খ":"L","গ":"M","ঘ":"N","ঙ":"O","চ":"P","ছ":"Q","জ":"R","ঝ":"S","ঞ":"T","ট":"U","ঠ":"V","ড":"W","ঢ":"X","ণ":"Y","ত":"Z","থ":"_","দ":"`","ধ":"a","ন":"b","প":"c","ফ":"d","ব":"e","ভ":"f","ম":"g","য":"h","র":"i","ল":"j","শ":"k","ষ":"l","স":"m","হ":"n","ড়":"o","ঢ়":"p","য়":"q","ৎ":"r","ং":"s","ঃ":"t","ঁ":"u","া":"v","ি":"w","ী":"x","ু":"y","ূ":"~","ৃ":"…","ে":"‡","ৈ":"‰","ো":"‡v","ৌ":"‡Š","্":"&","।":"|"};
  return String(s || "").replace(/([ক-হড়-য়])([িেৈ])/g, "$2$1").replace(/([ক-হড়-য়]্[ক-হড়-য়])([িেৈ])/g, "$2$1").replace(/ো/g, "ো").replace(/ৌ/g, "ৌ").split("").map(c => u2b[c] !== undefined ? u2b[c] : c).join("");
}

function translateDOM(root) {
  if (curLang === "bn") return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  let n;
  while (n = w.nextNode()) {
    if (n.parentElement && ["SCRIPT", "STYLE"].includes(n.parentElement.tagName)) continue;
    let t = n.nodeValue;
    if (!t || !t.trim()) continue;
    Object.keys(bn2enMap).forEach(k => { if (t.includes(k)) t = t.replaceAll(k, bn2enMap[k]); });
    t = t.replace(/রোড\s*([০-৯\d]+)/g, (_, d) => "Road " + toEn(d)).replace(/বাড়ী\s*/g, "House ").replace(/[০-৯]/g, c => String("০১২৩৪৫৬৭৮৯".indexOf(c)));
    n.nodeValue = t;
  }
}

  window.makeOfflineQrDataUrl = function(text) {
    const c = document.createElement("canvas");
    c.width = 160; c.height = 160;
    const ctx = c.getContext("2d");
    ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, 160, 160);
    ctx.fillStyle = "#000000";
    let h = 2166136261;
    for (let i = 0; i < text.length; i++) { h ^= text.charCodeAt(i); h = Math.imul(h, 16777619); }
    const sz = 25, cell = 5, off = 17;
    const finder = (gx, gy) => {
      ctx.fillRect(off + gx * cell, off + gy * cell, 7 * cell, 7 * cell);
      ctx.fillStyle = "#ffffff"; ctx.fillRect(off + (gx + 1) * cell, off + (gy + 1) * cell, 5 * cell, 5 * cell);
      ctx.fillStyle = "#000000"; ctx.fillRect(off + (gx + 2) * cell, off + (gy + 2) * cell, 3 * cell, 3 * cell);
    };
    finder(0, 0); finder(sz - 7, 0); finder(0, sz - 7);
    for (let y = 0; y < sz; y++) {
      for (let x = 0; x < sz; x++) {
        if ((x < 8 && y < 8) || (x > sz - 9 && y < 8) || (x < 8 && y > sz - 9)) continue;
        h = (Math.imul(h ^ (x * 31 + y * 17), 16777619)) >>> 0;
        if (h % 2 === 0) ctx.fillRect(off + x * cell, off + y * cell, cell, cell);
      }
    }
    return c.toDataURL("image/png");
  };

    if (/[\u0980-\u09FF]/.test(t)) {
      const cM = {"ক":"k","খ":"kh","গ":"g","ঘ":"gh","ঙ":"ng","চ":"ch","ছ":"chh","জ":"j","ঝ":"jh","ঞ":"n","ট":"t","ঠ":"th","ড":"d","ঢ":"dh","ণ":"n","ত":"t","থ":"th","দ":"d","ধ":"dh","ন":"n","প":"p","ফ":"f","ব":"b","ভ":"bh","ম":"m","য":"j","র":"r","ল":"l","শ":"sh","ষ":"sh","স":"s","হ":"h","ড়":"r","ঢ়":"rh","য়":"y","ৎ":"t","ং":"ng","ঃ":"","ঁ":""};

      for (let i = 0; i < chs.length; i++) {
        let c = chs[i], nx = chs[i + 1];

      }
      t = o.replace(/\b\w/g, l => l.toUpperCase());
    }
    return t;
  }

  function buildOfflineQr(text) {
    const c = document.createElement("canvas");
    c.width = 160; c.height = 160;
    const ctx = c.getContext("2d");
    ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, 160, 160);
    ctx.fillStyle = "#000000";
    let h = 2166136261;
    for (let i = 0; i < text.length; i++) { h ^= text.charCodeAt(i); h = Math.imul(h, 16777619); }
    const sz = 25, cell = 5, off = 17;
    const finder = (gx, gy) => {
      ctx.fillRect(off + gx * cell, off + gy * cell, 7 * cell, 7 * cell);
      ctx.fillStyle = "#ffffff"; ctx.fillRect(off + (gx + 1) * cell, off + (gy + 1) * cell, 5 * cell, 5 * cell);
      ctx.fillStyle = "#000000"; ctx.fillRect(off + (gx + 2) * cell, off + (gy + 2) * cell, 3 * cell, 3 * cell);
    };
    finder(0, 0); finder(sz - 7, 0); finder(0, sz - 7);
    for (let y = 0; y < sz; y++) {
      for (let x = 0; x < sz; x++) {
        if ((x < 8 && y < 8) || (x > sz - 9 && y < 8) || (x < 8 && y > sz - 9)) continue;
        h = (Math.imul(h ^ (x * 31 + y * 17), 16777619)) >>> 0;
        if (h % 2 === 0) ctx.fillRect(off + x * cell, off + y * cell, cell, cell);
      }
    }
    return c.toDataURL("image/png");
  }

      btn.textContent = "👥 এডমিন ব্যবস্থাপনা (কর্মকর্তা যোগ ও পাসওয়ার্ড)";
      btn.onclick = () => window.openSubAdminManager();
      const closeBtn = [...document.querySelectorAll("#dlg .btn")].find(b => b.textContent.trim() === "বন্ধ");
      if (closeBtn && closeBtn.parentNode) closeBtn.parentNode.insertBefore(btn, closeBtn);
      else document.getElementById("dlg").appendChild(btn);
    }

    const passInp = document.querySelector("#login input[type='password'], #gate input[type='password']");
    const loginBtn = document.querySelector("#login .btn, #gate .btn");
    if (passInp && loginBtn && !passInp.dataset.subHooked) {
      passInp.dataset.subHooked = "1";
      loginBtn.addEventListener("click", () => {
        const val = passInp.value.trim();
        const subs = db._get("sub_admins_list", []);
        const found = subs.find(u => u.pass === val || (u.email + ":" + u.pass) === val);
        if (found) {
          passInp.value = typeof ADMIN_PASS !== "undefined" ? ADMIN_PASS : (db._get("admin_pass", "1234"));
          sessionStorage.setItem("active_sub_admin", JSON.stringify(found));
        }
      }, true);
    }
  }, 350);

  window.openSubAdminManager = function() {
    const list = db._get("sub_admins_list", []);
    const itemsHtml = list.length ? list.map((u, i) => `
      <div style="display:flex;justify-content:space-between;align-items:center;padding:8px;border:1px solid var(--line);border-radius:8px;margin-top:6px;background:var(--bg);">
        <div>
          <b>${esc(u.name)}</b> <small style="color:#0a6b6b;">(${esc(u.role)})</small><br>
          <small>ইমেইল: <b>${esc(u.email)}</b> | পাসওয়ার্ড: <b>${esc(u.pass)}</b></small>
        </div>
        <div style="display:flex;gap:5px;">
          <button class="btn ghost" onclick="window._copySubAdmin(${i})">📋 কপি</button>
          <button class="btn ghost" style="color:#b42318;" onclick="window._delSubAdmin(${i})">🗑️</button>
        </div>
      </div>`).join("") : `<p class="msg">এখনো কোনো কর্মকর্তা বা সহ-এডমিন যোগ করা হয়নি।</p>`;

    dlg.innerHTML = `<h2>👥 এডমিন ব্যবস্থাপনা (কর্মকর্তা যোগ)</h2>
      <div class="fg" style="background:var(--bg);padding:10px;border-radius:10px;border:1px solid var(--line);">
        <label>কর্মকর্তার নাম<input type="text" id="sa_name" placeholder="যেমন: মোঃ কামাল উদ্দিন"></label>
        <label>ইমেইল এড্রেস<input type="email" id="sa_email" placeholder="example@gmail.com"></label>
        <label>পাসওয়ার্ড নির্ধারণ করুন<input type="text" id="sa_pass" placeholder="কমপক্ষে ৬ অক্ষর"></label>
        <label>কাজের অনুমতি<select id="sa_role">
          <option value="তথ্য এন্ট্রি ও সংশোধন">তথ্য এন্ট্রি ও সংশোধন</option>
          <option value="শুধুমাত্র দেখা ও প্রিন্ট">শুধুমাত্র দেখা ও প্রিন্ট</option>
          <option value="সহ-এডমিন (পূর্ণ ক্ষমতা)">সহ-এডমিন (পূর্ণ ক্ষমতা)</option>
        </select></label>
      </div>
      <div class="bar"><button class="btn" id="sa_save_btn">➕ কর্মকর্তা যোগ করুন</button></div>
      <div style="margin-top:10px;"><b>অনুমোদিত কর্মকর্তাদের তালিকা (${toBn(list.length)} জন):</b>${itemsHtml}</div>
      <div class="bar"><button class="btn ghost" onclick="dlg.close()">বন্ধ</button></div>`;
    dlg.showModal();

    document.getElementById("sa_save_btn").onclick = () => {
      const name = document.getElementById("sa_name").value.trim();
      const email = document.getElementById("sa_email").value.trim();
      const pass = document.getElementById("sa_pass").value.trim();
      const role = document.getElementById("sa_role").value;
      if (!name || !email || !pass) return alert("অনুগ্রহ করে নাম, ইমেইল এবং পাসওয়ার্ড লিখুন।");
      const cur = db._get("sub_admins_list", []);
      cur.push({ name, email, pass, role });
      db._set("sub_admins_list", cur);
      window.openSubAdminManager();
    };
  };

  window._copySubAdmin = function(idx) {
    const u = db._get("sub_admins_list", []).at(idx);
    if (!u) return;
    const msg = `আসসালামু আলাইকুম ${u.name},\n${ORG_NAME} পোর্টালে কাজ করার জন্য আপনার লগইন তথ্য:\nলিংক: ${location.href.split("?").at(0)}\nইমেইল: ${u.email}\nপাসওয়ার্ড: ${u.pass}\nদায়িত্ব: ${u.role}`;
    navigator.clipboard?.writeText(msg);
    alert("কর্মকর্তার লগইন বার্তা ও লিংক কপি হয়েছে! এখন WhatsApp বা ইমেইলে পেস্ট করে পাঠিয়ে দিন।");
  };

  window._delSubAdmin = function(idx) {
    if (!confirm("এই কর্মকর্তার অনুমতি বাতিল করবেন?")) return;
    const cur = db._get("sub_admins_list", []);
    cur.splice(idx, 1);
    db._set("sub_admins_list", cur);
    window.openSubAdminManager();
  };
  const bnM_fix = ["জানুয়ারি","ফেব্রুয়ারি","মার্চ","এপ্রিল","মে","জুন","জুলাই","আগস্ট","সেপ্টেম্বর","অক্টোবর","নভেম্বর","ডিসেম্বর"];
  const enM_fix = ["January","February","March","April","May","June","July","August","September","October","November","December"];

  function bnOrd_fix(d) {
    if (d === 1) return "১লা";
    if (d === 2 || d === 3) return toBn(d) + "রা";
    if (d === 4) return "৪ঠা";
    if (d >= 5 && d <= 18) return toBn(d) + "ই";
    return toBn(d) + "শে";
  }

  function convertAnyDate(val) {
    const s = toEn(String(val)).trim();
    const parts = s.split(/[\/\-\.\\]+/);
    if (parts.length !== 3) return val;
    let d = 0, m = 0, y = 0;
    if (parts.at(0).length === 4) {
      y = parseInt(parts.at(0), 10);
      m = parseInt(parts.at(1), 10);
      d = parseInt(parts.at(2), 10);
    } else if (parts.at(2).length === 4) {
      d = parseInt(parts.at(0), 10);
      m = parseInt(parts.at(1), 10);
      y = parseInt(parts.at(2), 10);
    } else {
      return val;
    }
    if (!d || !m || m < 1 || m > 12 || y < 1900 || y > 2100) return val;
    const isEn = (typeof curLang !== "undefined" && curLang === "en");
    return isEn ? (d + " " + enM_fix[m - 1] + " " + y) : (bnOrd_fix(d) + " " + bnM_fix[m - 1] + " " + toBn(y));
  }

  setInterval(() => {
    document.querySelectorAll(".m, #pv, .pdfpage, #list").forEach(box => {
      const w = document.createTreeWalker(box, NodeFilter.SHOW_TEXT);
      let n;
      while (n = w.nextNode()) {
        if (!n.nodeValue) continue;
        if (/[\/\-\.\\]/.test(n.nodeValue)) {
          n.nodeValue = n.nodeValue.replace(/([০-৯\d]{1,4}[\/\-\.\\][০-৯\d]{1,2}[\/\-\.\\][০-৯\d]{1,4})/g, convertAnyDate);
        }
      }
    });

    const pv = document.getElementById("pv");
    if (pv) {
      const todayTxt = convertAnyDate(new Date().toLocaleDateString("en-GB"));
      pv.querySelectorAll(".sub, p, div").forEach(el => {
        if (el.querySelector("table") || el.classList.contains("clean-hdr") || el.classList.contains("hdr-split")) return;
        const txt = el.textContent.trim();
        if (txt.includes("তারিখ") && txt.length < 120 && !txt.includes("বয়স/জন্ম")) {
          const leftPart = txt.split(/,?\s*তারিখ[:\s]*/).at(0).trim();
          el.style.display = "none";
          const tbl = pv.querySelector("table");
          if (tbl) {
            let hdr = tbl.previousElementSibling;
            if (!hdr || !hdr.classList.contains("clean-hdr")) {
              hdr = document.createElement("div");
              hdr.className = "clean-hdr";
              hdr.style.cssText = "display:flex;justify-content:space-between;align-items:center;width:100%;margin:8px 0 6px;padding-bottom:4px;border-bottom:1.5px solid #0a6b6b;font-weight:700;font-size:10.5pt;";
              tbl.parentNode.insertBefore(hdr, tbl);
            }
            const labelLeft = leftPart.includes("সদস্য তালিকা") ? leftPart : ("সদস্যের নাম: " + leftPart);
            hdr.innerHTML = `<span>${esc(labelLeft)}</span><span>তারিখ: ${esc(todayTxt)}</span>`;
          }
        }
      });
    }

    const idCard = document.getElementById("smartIdCardArea");
    if (idCard) {
      const isEn = (typeof curLang !== "undefined" && curLang === "en");
      const topH1 = document.querySelector("#hdr h1, .brand h1, header h1");
      if (isEn) {
        const orgEl = idCard.querySelector(".smart-id-org");
        if (orgEl && topH1 && topH1.textContent.trim()) orgEl.textContent = topH1.textContent.trim();
        const footEl = idCard.querySelector(".smart-id-foot");
        const topSub = document.querySelector("#hdr small, .brand small, header p");
        if (footEl && topSub && topSub.textContent.trim()) footEl.textContent = topSub.textContent.trim();
      }

      const prBtn = [...document.querySelectorAll("#dlg .bar .btn")].find(b => b.textContent.includes("প্রিন্ট") || b.textContent.includes("Print"));
      if (prBtn) {
        prBtn.onclick = (e) => {
          e.preventDefault();
          const cardClone = idCard.outerHTML;
          dlg.close();
          const pvEl = document.getElementById("pv");
          if (pvEl) {
            pvEl.style.display = "block";
            pvEl.innerHTML = `<div class="bar" style="margin-bottom:10px;display:flex;gap:8px;justify-content:center;">
              <button class="btn" onclick="window.print()">🖨️ এখনই প্রিন্ট করুন</button>
              <button class="btn ghost" onclick="document.getElementById('pv').style.display='none'">বন্ধ করুন</button>
            </div>
            <div style="display:flex;justify-content:center;padding:12px;">${cardClone}</div>`;
            pvEl.scrollIntoView({ behavior: "smooth" });
          }
        };
      }
    }

    const qMem = new URLSearchParams(location.search).get("member");
    if (qMem && !document.getElementById("self_bg_wrap")) {
      const allLabels = [...document.querySelectorAll("label")];
      const targetLbl = allLabels.find(l => l.textContent.includes("বর্তমান ঠিকানা") || l.textContent.includes("ইমেইল") || l.textContent.includes("পেশা"));
      if (targetLbl && targetLbl.parentNode) {
        const r = rows.find(x => toEn(x.n) === toEn(qMem));
        const bgs = db._get("member_blood_groups", {});
        const curBg = r ? (bgs[String(r.s)] || r.bg || "") : "";
        const wrap = document.createElement("label");
        wrap.id = "self_bg_wrap";
        wrap.innerHTML = `রক্তের গ্রুপ (Blood Group)
          <select id="self_bg_sel">
            <option value="">নির্বাচন করুন</option>
            ${["A+","A-","B+","B-","O+","O-","AB+","AB-"].map(g => `<option value="${g}" ${curBg === g ? "selected" : ""}>${g}</option>`).join("")}
          </select>`;
        targetLbl.parentNode.insertBefore(wrap, targetLbl.nextSibling);

        const saveSelfBtn = [...document.querySelectorAll("button")].find(b => b.textContent.includes("সংরক্ষণ"));
        if (saveSelfBtn) {
          saveSelfBtn.addEventListener("click", () => {
            if (r) {
              const st = db._get("member_blood_groups", {});
              st[String(r.s)] = document.getElementById("self_bg_sel")?.value || "";
              db._set("member_blood_groups", st);
            }
          }, true);
        }
      }
    }
  }, 250);
  setInterval(() => {
    const dlgEl = document.getElementById("dlg");
    if (!dlgEl || !dlgEl.open) return;
    dlgEl.querySelectorAll("a").forEach(a => {
      const href = a.getAttribute("href") || "";
      if (href.includes("whatsapp.com") || href.includes("wa.me") || a.textContent.includes("WhatsApp")) {
        const m = href.match(/text=([^&]*)/);
        const rawTxt = m ? decodeURIComponent(m.at(1)) : "";
        let num = "";
        const numMatch = href.match(/(?:phone=|wa\.me\/)(\d{10,15})/);
        if (numMatch) {
          num = numMatch.at(1);
        } else if (a.parentElement) {
          const rowPh = toEn(a.parentElement.textContent).match(/01[3-9]\d{8}/);
          if (rowPh) num = "88" + rowPh.at(0);
        }
        const cleanHref = "https://wa.me" + num + (rawTxt ? "?text=" + encodeURIComponent(rawTxt) : "");
        if (href !== cleanHref) {
          a.setAttribute("href", cleanHref);
          a.setAttribute("target", "_blank");
          a.setAttribute("rel", "noopener");
        }
      }
    });
  }, 350);

</script>


<script>
(function(){
  const bnM = ["জানুয়ারি","ফেব্রুয়ারি","মার্চ","এপ্রিল","মে","জুন","জুলাই","আগস্ট","সেপ্টেম্বর","অক্টোবর","নভেম্বর","ডিসেম্বর"];
  const enM = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const toEn = v => String(v == null ? "" : v).replace(/[০-৯]/g, d => "০১২৩৪৫৬৭৮৯".indexOf(d));
  const toBn = v => String(v == null ? "" : v).replace(/\d/g, d => "০১২৩৪৫৬৭৮৯"[d]);
  const esc = v => String(v == null ? "" : v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  const bnOrd = d => d === 1 ? "১লা" : (d === 2 || d === 3) ? toBn(d) + "রা" : d === 4 ? "৪ঠা" : (d >= 5 && d <= 18) ? toBn(d) + "ই" : toBn(d) + "শে";

  function getPhone11(raw) {
    const m = toEn(raw).replace(/\D/g, "").match(/(?:88)?(01[3-9]\d{8})/);
    return m ? m.at(1) : "";
  }
  function fmtDateSafe(val) {
    const p = toEn(val).trim().split(/[\/\-\.\\]+/);
    if (p.length !== 3) return val;
    let d = 0, m = 0, y = 0;
    const p0 = p.at(0) || "", p1 = p.at(1) || "", p2 = p.at(2) || "";
    if (p0.length === 4) { y = +p0; m = +p1; d = +p2; }
    else if (p2.length === 4) { d = +p0; m = +p1; y = +p2; }
    else return val;
    if (!d || !m || m < 1 || m > 12 || y < 1900 || y > 2100) return val;
    const isEn = (typeof curLang !== "undefined" && curLang === "en");
    return isEn ? `${d} ${enM[m - 1]} ${y}` : `${bnOrd(d)} ${bnM[m - 1]} ${toBn(y)}`;
  }
  function encObj(obj) {
    return btoa(unescape(encodeURIComponent(JSON.stringify(obj)))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
  }
  function decObj(b64) {
    let s = String(b64).replace(/-/g,"+").replace(/_/g,"/");
    while (s.length % 4) s += "=";
    return JSON.parse(decodeURIComponent(escape(atob(s))));
  }

  // ১. সদস্য কার্ডের 'লিংক' বাটনে ২টি অপশন (তথ্য হালনাগাদ লিংক + একক বার্তা) ও সরাসরি WhatsApp
  document.addEventListener("click", function(e) {
    const btn = e.target.closest("button, a");
    if (!btn) return;
    const label = (btn.textContent || "").trim();

    if (label.includes("লিংক") && !label.includes("ভোটার") && !label.includes("কপি") && !label.includes("সেভ") && !label.includes("তথ্য হালনাগাদ")) {
      const card = btn.closest(".m");
      if (!card) return;
      e.preventDefault();
      e.stopImmediatePropagation();

      const txtAll = card.innerText || card.textContent || "";
      const ph11 = getPhone11(txtAll);
      const numM = toEn(txtAll).match(/সদস্য নং[:\s]*(\d+)/);
      const mNo = numM ? numM.at(1) : "";
      const nameEl = card.querySelector("b, strong, h3, h4, .nm");
      const mName = nameEl ? nameEl.textContent.trim() : "সম্মানিত সদস্য";

      let info = { n: mNo, nm: mName, f: "", m: "", o: "", b: "", h: "", r: "", fl: "", ph: ph11, bg: "" };
      if (typeof rows !== "undefined" && Array.isArray(rows)) {
        const f = rows.find(x => toEn(x.n) === mNo || x.nm === mName);
        if (f) {
          const dbPh = getPhone11(JSON.stringify(f));
          const bgs = (typeof db !== "undefined" && db._get) ? db._get("member_blood_groups", {}) : {};
          info = {
            s: f.s, n: f.n, nm: f.nm, f: f.f || "", m: f.m || "", o: f.o || "",
            b: f.b || "", h: f.h || "", r: f.r || "", fl: f.fl || "",
            ph: ph11 || dbPh, bg: bgs[String(f.s)] || f.bg || ""
          };
        }
      }

      const pin = String(Math.floor(1000 + Math.random() * 9000));
      info.pin = pin;
      const baseUrl = location.href.split("?").at(0);
      const link = `${baseUrl}?member=${mNo || "1"}&d=${encObj(info)}`;
      const linkMsg = `আসসালামু আলাইকুম ${info.nm},\nনাসিরাবাদ হাউজিং সোসাইটি-তে আপনার তথ্য হালনাগাদ করতে নিচের লিংকে ক্লিক করুন।\nগোপন পিন কোড: ${pin}\nলিংক: ${link}`;
      const singleMsg = `আসসালামু আলাইকুম ${info.nm},\n`;

      const oldM = document.getElementById("nhsMasterModal");
      if (oldM) oldM.remove();

      const modal = document.createElement("div");
      modal.id = "nhsMasterModal";
      modal.style.cssText = "position:fixed;inset:0;z-index:2147483647;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;padding:14px;color-scheme:light;";
      modal.innerHTML = `<div style="background:#fff;color:#0f172a;max-width:460px;width:100%;padding:18px;border-radius:14px;border:2px solid #0a6b6b;">
        <h3 style="margin:0 0 10px;color:#064e4e;">💬 WhatsApp যোগাযোগ (পিন: ${pin})</h3>
        <div style="display:flex;gap:6px;margin-bottom:10px;">
          <button type="button" id="mTabLink" style="flex:1;background:#0a6b6b;color:#fff;border:none;padding:8px;border-radius:8px;font-weight:700;font-size:.82rem;cursor:pointer;">🔗 তথ্য হালনাগাদ লিংক</button>
          <button type="button" id="mTabMsg" style="flex:1;background:#e2e8f0;color:#0f172a;border:none;padding:8px;border-radius:8px;font-weight:700;font-size:.82rem;cursor:pointer;">✍️ একক বার্তা লিখুন</button>
        </div>
        <label style="display:block;font-size:.88rem;font-weight:700;margin-bottom:8px;">সদস্যের মোবাইল নম্বর:
          <input id="mWaPhone" type="tel" value="${esc(info.ph)}" placeholder="018XXXXXXXX" style="width:100%;padding:9px;margin-top:4px;border:1.5px solid #0a6b6b;border-radius:8px;font-size:1rem;box-sizing:border-box;background:#fff;color:#0f172a;">
        </label>
        <textarea id="mWaMsg" style="width:100%;height:110px;padding:8px;border:1px solid #cbd5e1;border-radius:8px;font-size:.86rem;box-sizing:border-box;background:#fff;color:#0f172a;" readonly>${esc(linkMsg)}</textarea>
        <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;">

  const addrInp = document.getElementById("uf_addr");
  if (!addrInp || document.getElementById("uf_photo_box")) return;

  const box = document.createElement("div");
  box.id = "uf_photo_box";
  box.style.cssText = "display:grid;gap:8px;padding:10px;background:#f8fafc;border:1.5px dashed #0a6b6b;border-radius:10px;";
  box.innerHTML = `
    <label style="font-weight:700;color:#064e4e;">📷 নতুন ছবি আপলোড করুন (ঐচ্ছিক)
      <input type="file" id="uf_photo_inp" accept="image/*" style="display:block;margin-top:4px;font-size:.85rem;">
    </label>
    <img id="uf_photo_prev" style="display:none;max-height:110px;border-radius:8px;border:1px solid #cbd5e1;">
    <label style="font-weight:700;color:#064e4e;">🪪 এনআইডি (NID) কার্ডের ছবি (ঐচ্ছিক)
      <input type="file" id="uf_nid_inp" accept="image/*" style="display:block;margin-top:4px;font-size:.85rem;">
    </label>
    <img id="uf_nid_prev" style="display:none;max-height:110px;border-radius:8px;border:1px solid #cbd5e1;">
  `;
  addrInp.closest("label").insertAdjacentElement("afterend", box);

  let photoData = "", nidData = "";
  const readPreview = (inpId, imgId, cb) => {
    document.getElementById(inpId).onchange = ev => {
      const f = ev.target.files && ev.target.files.item(0);
      if (!f) return;
      const rd = new FileReader();
      rd.onload = () => {
        const img = document.getElementById(imgId);
        img.src = rd.result;
        img.style.display = "block";
        cb(rd.result);
      };
      rd.readAsDataURL(f);
    };
  };
  readPreview("uf_photo_inp", "uf_photo_prev", d => photoData = d);
  readPreview("uf_nid_inp", "uf_nid_prev", d => nidData = d);

  const dlBtn = document.getElementById("uf_dl");
  if (dlBtn) {
    dlBtn.textContent = "📥 ছবিসহ পূর্ণাঙ্গ তথ্য সংরক্ষণ (ডাউনলোড) করুন";
    dlBtn.onclick = () => {
      const htmlDoc = `<!DOCTYPE html><html lang="bn"><head><meta charset="utf-8"><title>সদস্য হালনাগাদ কপি</title></head><body style="font-family:sans-serif;padding:20px;max-width:520px;margin:auto;border:2px solid #0a6b6b;border-radius:12px;">
        <h2 style="color:#064e4e;margin-top:0;">নাসিরাবাদ হাউজিং সোসাইটি কল্যাণ পরিষদ</h2>
        <h3>সদস্য তথ্য হালনাগাদ কপি</h3><hr>
        ${photoData ? `<p><b>সদস্যের ছবি:</b><br><img src="${photoData}" style="max-height:140px;border-radius:8px;border:1px solid #ccc;"></p>` : ""}
        <p><b>সদস্যের নাম:</b> ${document.getElementById("uf_nm")?.value || ""}</p>
        <p><b>পিতার নাম:</b> ${document.getElementById("uf_f")?.value || ""}</p>
        <p><b>মাতার নাম:</b> ${document.getElementById("uf_m")?.value || ""}</p>
        <p><b>পেশা:</b> ${document.getElementById("uf_o")?.value || ""}</p>
        <p><b>রক্তের গ্রুপ:</b> ${document.getElementById("uf_bg")?.value || ""}</p>
        <p><b>মোবাইল নম্বর:</b> ${document.getElementById("uf_ph")?.value || ""}</p>
        <p><b>বর্তমান ঠিকানা:</b> ${document.getElementById("uf_addr")?.value || ""}</p>
        ${nidData ? `<p><b>এনআইডি (NID) কপি:</b><br><img src="${nidData}" style="max-width:100%;max-height:200px;border-radius:8px;border:1px solid #ccc;"></p>` : ""}
      </body></html>`;
      const blob = new Blob([htmlDoc], { type: "text/html;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "Member_Update_With_Photo.html";
      a.click();
    };
  }
}, 500);
</script>

<script>
setInterval(function() {
  const box = document.getElementById("uf_photo_box");
  if (!box || box.dataset.smartV2) return;

    </label>
    <img id="uf_p_prev" style="display:none;max-height:110px;border-radius:8px;border:1.5px solid #0a6b6b;">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px;">
      <label style="font-weight:700;color:#064e4e;font-size:.84rem;">🪪 NID সামনের পিঠ (Front)
        <input type="file" id="uf_nid_f" accept="image/*" style="display:block;margin-top:4px;font-size:.78rem;width:100%;">
        <img id="uf_nid_f_prev" style="display:none;max-height:85px;max-width:100%;margin-top:4px;border-radius:6px;border:1px solid #94a3b8;">
      </label>
      <label style="font-weight:700;color:#064e4e;font-size:.84rem;">🪪 NID পেছনের পিঠ (Back)

      </label>
    </div>
  `;

  let pData = "", nidFData = "", nidBData = "";

    document.getElementById(iId).onchange = ev => {
      const f = ev.target.files && ev.target.files.item(0);

      const docHtml = `<!DOCTYPE html><html lang="bn"><head><meta charset="utf-8"><title>সদস্য হালনাগাদ কপি - ${mNo}</title></head><body style="font-family:sans-serif;background:#f1f5f9;padding:20px;">

<script>
(function(){

  const UPLOAD_PRESET = "nhs-photos";

  async function uploadToCloudinary(file) {
    const fd = new FormData();
    fd.append("file", file);
    fd.append("upload_preset", UPLOAD_PRESET);
    fd.append("folder", "nasirabad_members");
    const res = await fetch(`https://cloudinary.com{CLOUD_NAME}/image/upload`, {
      method: "POST",
      body: fd
    });
    const data = await res.json();
    if (!data.secure_url) throw new Error(data.error?.message || "Upload failed");
    return data.secure_url;
  }

  document.addEventListener("change", async function(e) {
    const inp = e.target;
    if (!inp || inp.type !== "file" || !inp.files || !inp.files.length) return;
    const file = inp.files[0];
    if (!file.type.startsWith("image/")) return;

    try {
      const hdUrl = await uploadToCloudinary(file);
      inp.dataset.cloudUrl = hdUrl;

      if (inp.id === "uf_p_inp" || inp.id === "uf_photo_inp") {
        window.__nhsUploadedPhotoUrl = hdUrl;
        const prev = document.getElementById("uf_p_prev") || document.getElementById("uf_photo_prev");
        if (prev) { prev.src = hdUrl; prev.style.display = "block"; }
      }
    } catch (err) {
      console.warn("Cloud upload fallback:", err);
    }
  }, true);

  setInterval(function() {
    const curWrap = document.getElementById("uf_cur_photo_wrap");
    if (!curWrap || curWrap.dataset.cloudChecked) return;
    curWrap.dataset.cloudChecked = "1";
    const qp = new URLSearchParams(location.search);
    const oldPhoto = qp.get("photo") || "";
    if (oldPhoto.startsWith("http")) {

    }
  }, 500);
})();

<script>
(function(){

  const esc = v => String(v == null ? "" : v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

  const OPTIONAL_THEMES = {

          <input id="inpOrgAddr" type="text" value="${esc(localStorage.getItem("nhs_custom_org_addr") || cur.addr)}" placeholder="প্রতিষ্ঠানের ঠিকানা লিখুন..." style="padding:7px;border:1px solid #94a3b8;border-radius:7px;width:100%;box-sizing:border-box;">
          <input id="inpDevBrand" type="text" value="${esc(localStorage.getItem("nhs_dev_brand") || "Developed & Powered by S. M. Forkan Uddin")}" placeholder="নির্মাতা ব্র্যান্ডিং নাম..." style="padding:7px;border:1px solid #94a3b8;border-radius:7px;width:100%;box-sizing:border-box;">
          <label style="font-weight:600;color:#064e4e;">🖼️ প্রতিষ্ঠানের লোগো আপলোড করুন:
            <input id="inpOrgLogo" type="file" accept="image/*" style="display:block;margin-top:4px;font-size:.82rem;">
          </label>
          <div style="display:flex;justify-content:space-between;align-items:center;gap:6px;">
            <span style="font-weight:700;">🎨 ঐচ্ছিক থিম:</span>
            <select id="nhsCleanThSel" style="padding:5px 8px;border-radius:6px;border:1px solid #0a6b6b;font-weight:700;background:#fff;">
              <option value="default">🌿 আসল রঙ (অপরিবর্তিত)</option>
              <option value="navy">🌊 নেভি ব্লু</option>
              <option value="emerald">🌲 গাঢ় পান্না সবুজ</option>
              <option value="dark">🌙 ডার্ক মোড</option>
            </select>
          </div>
          <button type="button" id="saveOrgCustomBtn" style="background:#0a6b6b;color:#fff;border:none;padding:8px;border-radius:8px;font-weight:700;cursor:pointer;">💾 সংরক্ষণ করুন</button>
        `;
        h2.insertAdjacentElement("afterend", box);
        const sel = document.getElementById("nhsCleanThSel");
        sel.value = localStorage.getItem("nhs_opt_th") || "default";
        sel.onchange = () => applyOptionalTheme(sel.value);

        document.getElementById("inpOrgLogo").onchange = function(ev) {
          const f = ev.target.files && ev.target.files.at(0);
          if (!f) return;
          const rd = new FileReader();
          rd.onload = () => { localStorage.setItem("nhs_custom_org_logo", rd.result); applyDynamicHeader(); };
          rd.readAsDataURL(f);
        };

        document.getElementById("saveOrgCustomBtn").onclick = function() {
          localStorage.setItem("nhs_custom_org_name", document.getElementById("inpOrgName").value.trim());
          localStorage.setItem("nhs_custom_org_addr", document.getElementById("inpOrgAddr").value.trim());
          localStorage.setItem("nhs_dev_brand", document.getElementById("inpDevBrand").value.trim());
          applyDynamicHeader();
          alert("প্রতিষ্ঠানের নাম, ঠিকানা, লোগো ও ব্র্যান্ডিং সফলভাবে সংরক্ষিত হয়েছে!");
        };
      }
    }

    // গ) লিংক তৈরির সময় প্রতিষ্ঠানের নাম, ঠিকানা ও সদস্যের পুরোনো ছবি স্বয়ংক্রিয়ভাবে যুক্ত করা
    const msgTa = document.getElementById("mWaMsg");
    if (msgTa && msgTa.value.includes("member=") && !msgTa.value.includes("&oname=")) {
      const info = getOrgProfile();
      const mMatch = msgTa.value.match(/member=([০-৯\d]+)/);
      let extraParams = "&oname=" + encodeURIComponent(info.name);
      if (info.addr) extraParams += "&oaddr=" + encodeURIComponent(info.addr);
      if (mMatch && typeof rows !== "undefined" && Array.isArray(rows)) {
        const mNo = toEn(mMatch.at(1));
        const mem = rows.find(r => toEn(r.n) === mNo);
        const pUrl = mem ? (mem.p || mem.img || mem.photo || "") : "";
        if (pUrl.startsWith("http")) extraParams += "&photo=" + encodeURIComponent(pUrl);
      }
      msgTa.value = msgTa.value.replace(/(https?:\/\/[^\s]+)/, "$1" + extraParams);
      msgTa.dispatchEvent(new Event("input"));
    }

    // ঘ) সদস্য ফরমে নতুন ছবি আপলোড হলে WhatsApp/Email/Telegram লিংকে ছবির লিংক যুক্ত রাখা
    const subBtn = document.getElementById("uf_sub");
    if (subBtn && window.__nhsUploadedPhotoUrl && subBtn.href) {
      const pLine = encodeURIComponent("\nছবির লিংক: " + window.__nhsUploadedPhotoUrl);
      if (!subBtn.href.includes(encodeURIComponent(window.__nhsUploadedPhotoUrl))) subBtn.href += pLine;
      const emBtn = document.getElementById("retEmBtn");
      if (emBtn && emBtn.href && !emBtn.href.includes(encodeURIComponent(window.__nhsUploadedPhotoUrl))) emBtn.href += pLine;
      const tgBtn = document.getElementById("retTgBtn");
      if (tgBtn && tgBtn.href && !tgBtn.href.includes(encodeURIComponent(window.__nhsUploadedPhotoUrl))) tgBtn.href += pLine;
    }

    // ঙ) নির্বাচন কমিশন (EC / NID Portal) স্টাইলে ডাউনলোড কপি
    const dlInfoBtn = document.getElementById("uf_dl_info");
    if (dlInfoBtn && !dlInfoBtn.dataset.ecMasterReady) {
      dlInfoBtn.dataset.ecMasterReady = "1";
      dlInfoBtn.textContent = "🏛️ তথ্য বিবরণী কপি ডাউনলোড (নির্বাচন কমিশন স্টাইল)";
      dlInfoBtn.onclick = async function(ev) {
        ev.preventDefault();
        ev.stopImmediatePropagation();

        const org = getOrgProfile();
        const qp = new URLSearchParams(location.search);
        let mNo = (qp.get("member") || "").trim();
        if (!mNo) {
          const m = document.body.innerText.match(/সদস্য নং[:\s]*([০-৯\d]+)/);
          if (m) mNo = m.at(1);
        }
        const nm = document.getElementById("uf_nm")?.value || "";
        const f = document.getElementById("uf_f")?.value || "";
        const m = document.getElementById("uf_m")?.value || "";
        const o = document.getElementById("uf_o")?.value || "";
        const bg = document.getElementById("uf_bg")?.value || "";
        const ph = document.getElementById("uf_ph")?.value || "";
        const addr = document.getElementById("uf_addr")?.value || "";
        const photoSrc = window.__nhsUploadedPhotoUrl || document.getElementById("uf_p_prev")?.src || qp.get("photo") || "";

        const cv = document.createElement("canvas");
        cv.width = 1000;
        cv.height = 1320;
        const ctx = cv.getContext("2d");

        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, 1000, 1320);
        ctx.strokeStyle = "#064e3b";
        ctx.lineWidth = 6;
        ctx.strokeRect(24, 24, 952, 1272);
        ctx.strokeStyle = "#059669";
        ctx.lineWidth = 2;
        ctx.strokeRect(34, 34, 932, 1252);

        const hasLogo = Boolean(org.logo);
        const hdrH = hasLogo ? 225 : 155;
        ctx.fillStyle = "#064e3b";
        ctx.fillRect(34, 34, 932, hdrH);

        let textStartY = 88;
        if (hasLogo) {
          try {
            const lg = new Image();
            lg.crossOrigin = "anonymous";
            await new Promise((res, rej) => { lg.onload = res; lg.onerror = rej; lg.src = org.logo; });
            ctx.fillStyle = "#ffffff";
            ctx.beginPath();
            ctx.arc(500, 88, 42, 0, Math.PI * 2);
            ctx.fill();
            ctx.drawImage(lg, 464, 52, 72, 72);
            textStartY = 162;
          } catch (e) {}
        }

        ctx.fillStyle = "#ffffff";
        ctx.textAlign = "center";
        ctx.font = "bold 30px sans-serif";
        ctx.fillText(org.name, 500, textStartY);
        if (org.addr) {
          ctx.font = "19px sans-serif";
          ctx.fillStyle = "#d1fae5";
          ctx.fillText(org.addr, 500, textStartY + 34);
        }
        ctx.fillStyle = "#fde047";
        ctx.font = "bold 19px sans-serif";
        ctx.fillText("সদস্য তথ্য হালনাগাদ বিবরণী (অফিশিয়াল রেকর্ড কপি)", 500, textStartY + 68);

        const topOffset = 34 + hdrH + 18;
        ctx.fillStyle = "#ecfdf5";
        ctx.fillRect(54, topOffset, 892, 46);
        ctx.strokeStyle = "#059669";
        ctx.lineWidth = 1.5;
        ctx.strokeRect(54, topOffset, 892, 46);
        ctx.fillStyle = "#064e3b";
        ctx.textAlign = "left";
        ctx.font = "bold 20px sans-serif";
        ctx.fillText("সদস্য পরিচিতি নম্বর (ID): " + (mNo || "প্রযোজ্য নয়"), 74, topOffset + 30);
        ctx.textAlign = "right";
        ctx.fillStyle = "#b91c1c";
        ctx.fillText("তারিখ: " + new Date().toLocaleDateString("bn-BD"), 926, topOffset + 30);

        const bodyY = topOffset + 64;
        ctx.strokeStyle = "#064e3b";
        ctx.lineWidth = 2.5;
        ctx.strokeRect(54, bodyY, 220, 265);
        ctx.fillStyle = "#f8fafc";
        ctx.fillRect(56, bodyY + 2, 216, 261);

        if (photoSrc && photoSrc.startsWith("http")) {
          try {
            const img = new Image();
            img.crossOrigin = "anonymous";
            await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = photoSrc; });
            ctx.drawImage(img, 62, bodyY + 8, 204, 249);
          } catch (e) {
            ctx.fillStyle = "#64748b";
            ctx.textAlign = "center";
            ctx.font = "18px sans-serif";
            ctx.fillText("সদস্যের ছবি", 164, bodyY + 135);
          }
        } else {
          ctx.fillStyle = "#64748b";
          ctx.textAlign = "center";
          ctx.font = "18px sans-serif";
          ctx.fillText("ছবি সংযুক্ত নেই", 164, bodyY + 135);
        }

        ctx.fillStyle = "#dc2626";
        ctx.fillRect(54, bodyY + 277, 220, 44);
        ctx.fillStyle = "#ffffff";
        ctx.textAlign = "center";
        ctx.font = "bold 20px sans-serif";
        ctx.fillText("রক্তের গ্রুপ: " + (bg || "উল্লেখ নেই"), 164, bodyY + 306);

        const fields = [
          ["সদস্যের নাম", nm],
          ["পিতার নাম", f],
          ["মাতার নাম", m],
          ["পেশা", o],
          ["মোবাইল নম্বর", ph],
          ["বর্তমান ঠিকানা", addr]
        ];

        let y = bodyY;
        fields.forEach((row, idx) => {
          const rowH = idx === 5 ? 115 : 68;
          ctx.fillStyle = idx % 2 === 0 ? "#f0fdf4" : "#ffffff";
          ctx.fillRect(295, y, 651, rowH);
          ctx.strokeStyle = "#94a3b8";
          ctx.lineWidth = 1.5;
          ctx.strokeRect(295, y, 651, rowH);

          ctx.fillStyle = "#064e3b";
          ctx.textAlign = "left";
          ctx.font = "bold 20px sans-serif";
          ctx.fillText(row.at(0) + " :", 312, y + 42);

          ctx.fillStyle = "#0f172a";
          ctx.font = idx === 0 ? "bold 22px sans-serif" : "20px sans-serif";
          const valText = String(row.at(1) || "—");
          if (idx === 5 && valText.length > 34) {
            ctx.fillText(valText.slice(0, 34), 485, y + 40);
            ctx.fillText(valText.slice(34, 70), 485, y + 74);
          } else {
            ctx.fillText(valText, 485, y + 42);
          }
          y += rowH;
        });

        const declY = y + 32;
        ctx.fillStyle = "#f8fafc";
        ctx.fillRect(54, declY, 892, 95);
        ctx.strokeStyle = "#cbd5e1";
        ctx.strokeRect(54, declY, 892, 95);
        ctx.fillStyle = "#334155";
        ctx.textAlign = "left";
        ctx.font = "18px sans-serif";
        ctx.fillText("অঙ্গীকারনামা: উপরে প্রদত্ত সকল তথ্য ও ছবি আমার জানামতে সম্পূর্ণ সত্য ও নির্ভুল।", 74, declY + 38);
        ctx.fillText("প্রয়োজনে কর্তৃপক্ষ মূল জাতীয় পরিচয়পত্রের সাথে তথ্য যাচাই করতে পারবেন।", 74, declY + 70);

        const sigY = declY + 240;
        const sigs = ["সদস্যের স্বাক্ষর ও তারিখ", "তথ্য যাচাইকারীর স্বাক্ষর", "অনুমোদনকারী কর্তৃপক্ষ"];
        sigs.forEach((sTxt, i) => {
          const sx = 175 + i * 325;
          ctx.strokeStyle = "#0f172a";
          ctx.beginPath();
          ctx.moveTo(sx - 115, sigY);
          ctx.lineTo(sx + 115, sigY);
          ctx.stroke();
          ctx.fillStyle = "#0f172a";
          ctx.textAlign = "center";
          ctx.font = "bold 18px sans-serif";
          ctx.fillText(sTxt, sx, sigY + 30);
        });

        const a = document.createElement("a");
        a.download = `Member_EC_Profile_${mNo || "Record"}.png`;
        a.href = cv.toDataURL("image/png");
        a.click();
      };
    }
  }, 500);

  // ৭. আবেদন যাচাই ও অনুমোদন বক্স
  document.addEventListener("click", function(e) {
    const btn = e.target.closest("button, a");
    if (!btn) return;
    const t = (btn.textContent || "").trim();
    if (t.includes("আবেদন") || t.includes("নোটিফিকেশন")) {
      e.preventDefault();
      e.stopImmediatePropagation();

      const oldModal = document.getElementById("nhsApproveModal");
      if (oldModal) oldModal.remove();

      const modal = document.createElement("div");
      modal.id = "nhsApproveModal";
      modal.style.cssText = "position:fixed;inset:0;z-index:2147483647;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:12px;color-scheme:light;font-family:sans-serif;";
      modal.innerHTML = `
        <div style="background:#fff;color:#0f172a;max-width:460px;width:100%;max-height:90vh;overflow-y:auto;padding:16px;border-radius:14px;border:2px solid #0a6b6b;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
            <h3 style="margin:0;color:#064e4e;font-size:1.05rem;">📥 সদস্য তথ্য হালনাগাদ আবেদন যাচাই</h3>
            <button type="button" id="closeAppModal" style="background:#e2e8f0;border:none;padding:5px 10px;border-radius:6px;font-weight:700;cursor:pointer;">✕</button>
          </div>
          <p style="margin:0 0 8px;font-size:.84rem;color:#475569;">সদস্যের পাঠানো WhatsApp বা Email বার্তাটি কপি করে নিচের ঘরে পেস্ট করুন:</p>
          <textarea id="appWaInput" placeholder="এখানে সদস্যের পাঠানো পুরো মেসেজটি পেস্ট করুন..." style="width:100%;height:110px;padding:8px;border:1.5px solid #0a6b6b;border-radius:8px;box-sizing:border-box;font-size:.86rem;"></textarea>
          <button type="button" id="appVerifyBtn" style="width:100%;margin-top:8px;background:#0a6b6b;color:#fff;border:none;padding:10px;border-radius:8px;font-weight:700;cursor:pointer;">🔍 তথ্য ও ছবি যাচাই করুন</button>
          <div id="appPreviewBox" style="margin-top:10px;"></div>
        </div>
      `;
      document.body.appendChild(modal);
      document.getElementById("closeAppModal").onclick = () => modal.remove();

      document.getElementById("appVerifyBtn").onclick = () => {
        const raw = document.getElementById("appWaInput").value || "";
        const pick = lbl => {
          const m = raw.match(new RegExp(lbl + "[:\\s]*([^\\n]+)"));
          return m ? m.at(1).trim() : "";
        };
        const mNo = toEn(pick("সদস্য নং")).replace(/\D/g, "");
        const nm = pick("সদস্যের নাম");
        const f = pick("পিতার নাম");
        const m = pick("মাতার নাম");
        const o = pick("পেশা");
        const bg = pick("রক্তের গ্রুপ");
        const ph = pick("মোবাইল নম্বর");
        const addr = pick("বর্তমান ঠিকানা");
        const photoUrl = pick("ছবির লিংক");

        if (!mNo && !nm) {
          document.getElementById("appPreviewBox").innerHTML = `<div style="color:#dc2626;font-weight:700;font-size:.88rem;">সঠিক তথ্য পাওয়া যায়নি। পুরো মেসেজটি কপি করে পেস্ট করুন।</div>`;
          return;
        }

        const allRows = (typeof rows !== "undefined" && Array.isArray(rows)) ? rows : [];
        const mem = allRows.find(r => toEn(r.n) === mNo) || allRows.find(r => r.nm === nm);

        document.getElementById("appPreviewBox").innerHTML = `
          <div style="background:#f0fdfa;border:1.5px solid #0a6b6b;border-radius:10px;padding:10px;font-size:.86rem;">
            <div style="font-weight:700;color:#064e4e;margin-bottom:6px;">${mem ? "✅ সদস্য শনাক্ত হয়েছে (সদস্য নং: " + esc(mem.n) + ")" : "⚠️ এই সদস্য নম্বরটি মূল তালিকায় পাওয়া যায়নি"}</div>
            ${photoUrl.startsWith("http") ? `<div style="margin-bottom:6px;"><img src="${esc(photoUrl)}" style="max-height:95px;border-radius:8px;border:1px solid #0a6b6b;"></div>` : ""}
            <div><b>নাম:</b> ${esc(nm)}</div>
            <div><b>পিতা:</b> ${esc(f)} | <b>মাতা:</b> ${esc(m)}</div>
            <div><b>পেশা:</b> ${esc(o)} | <b>রক্ত:</b> ${esc(bg)}</div>
            <div><b>মোবাইল:</b> ${esc(ph)}</div>
            <div><b>ঠিকানা:</b> ${esc(addr)}</div>
            ${mem ? `<button type="button" id="appConfirmSave" style="width:100%;margin-top:10px;background:#16a34a;color:#fff;border:none;padding:10px;border-radius:8px;font-weight:700;cursor:pointer;">✅ অনুমোদন ও মূল তালিকায় সংরক্ষণ করুন</button>` : ""}
          </div>
        `;

        const confirmBtn = document.getElementById("appConfirmSave");
        if (confirmBtn && mem) {
          confirmBtn.onclick = () => {
            if (nm) mem.nm = nm;
            if (f) mem.f = f;
            if (m) mem.m = m;
            if (o) mem.o = o;
            if (ph) mem.ph = ph;
            if (addr) mem.b = addr;
            if (photoUrl.startsWith("http")) {
              mem.p = photoUrl;
              mem.img = photoUrl;
              mem.photo = photoUrl;
            }
            if (bg) {
              mem.bg = bg;
              try {
                const bgs = JSON.parse(localStorage.getItem("member_blood_groups") || "{}");
                bgs[String(mem.s)] = bg;
                localStorage.setItem("member_blood_groups", JSON.stringify(bgs));
              } catch(err) {}
            }
            try {
              if (typeof db !== "undefined" && db._set) db._set("rows", allRows);
              localStorage.setItem("nhs_rows", JSON.stringify(allRows));
            } catch(err) {}
            if (typeof render === "function") render();
            alert("সদস্য নং " + mem.n + "-এর তথ্য ও ছবি সফলভাবে অনুমোদিত হয়ে মূল তালিকায় সংরক্ষিত হয়েছে!");
            modal.remove();
          };
        }
      };
    }
  }, true);
})();
</script>
<style>
  /* ১. সবুজ হেডারের ভেতরের সব বাটন ও লেখা একদম স্পষ্ট সাদা রাখা এবং ডুপ্লিকেট বক্স লুকানো */
  header button, .topbar button, .hdr button { color: #ffffff !important; opacity: 1 !important; }
  header small, .topbar small, .hdr small, header p, .topbar p, .hdr p { color: #e2e8f0 !important; opacity: 1 !important; }
  #nhsMoreDrawer, #nhsMoreMenuBtn, #nhsSettingsThemeBox, #nhsThemeBar { display: none !important; }
</style>
<script>
(function(){
  // ২. কাঁপাকাঁপি বন্ধ করা: সেটিংসের পুরোনো লুপ থামানো
  for (let i = 1; i < 9999; i++) { clearInterval(i); }

  // ৩. ড্যাশবোর্ডে ৩ বার আসা রোড বাটনগুলোকে পরিষ্কার করে মাত্র ১টি রাখা
  setTimeout(function() {
    const roadBoxes = Array.from(document.querySelectorAll("div")).filter(d =>
      d.children.length >= 6 &&
      d.textContent.includes("রোড ০১") &&
      d.textContent.includes("ভোটার তালিকা থেকে বাদ")
    );
    roadBoxes.forEach((box, idx) => {
      if (idx > 0) box.style.display = "none";
    });
  }, 300);
})();
</script>
<script>
(function(){
  const esc = v => String(v == null ? "" : v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

  // ১. পর্দা যেন কখনোই ২.৫ সেকেন্ডের বেশি আটকে না থাকে তা নিশ্চিত করা
  function closeSplashSafely() {
    const sp = document.getElementById("nhsCurtainSplash");
    if (!sp) return;
    sp.style.opacity = "0";
    sp.style.transform = "scale(1.04)";
    sp.style.pointerEvents = "none";
    setTimeout(() => { if (sp && sp.parentNode) sp.remove(); }, 600);
  }
  setTimeout(closeSplashSafely, 2500);

  // ২. প্রতিষ্ঠানের লোগো ওয়েলকাম পর্দা ও মূল হেডারে বসানো
  function syncBrandLogo() {
    let logo = localStorage.getItem("nhs_custom_org_logo") || localStorage.getItem("org_logo") || localStorage.getItem("logo") || "";
    if (!logo) {
      const imgs = Array.from(document.querySelectorAll("header img, .topbar img, .hdr img, #dlg img"));
      const valid = imgs.find(im => im.src && (im.src.startsWith("data:image") || im.src.startsWith("http")));
      if (valid) {
        logo = valid.src;
        localStorage.setItem("nhs_custom_org_logo", logo);
      }
    }

    const splash = document.getElementById("nhsCurtainSplash");
    if (splash) {
      splash.onclick = closeSplashSafely;
      if (logo) {
        const iconBox = splash.firstElementChild;
        if (iconBox && iconBox.tagName !== "IMG") {
          const img = document.createElement("img");
          img.src = logo;
          img.style.cssText = "width:88px;height:88px;object-fit:contain;border-radius:50%;background:#ffffff;padding:6px;margin-bottom:14px;box-shadow:0 8px 24px rgba(0,0,0,.35);";
          iconBox.replaceWith(img);
        }
      }
    }

    const hdr = document.querySelector("header, .topbar, .hdr");
    if (hdr && logo && !document.getElementById("nhsTopLogoImg")) {
      const h1 = hdr.querySelector("h1");
      if (h1) {
        const topImg = document.createElement("img");
        topImg.id = "nhsTopLogoImg";
        topImg.src = logo;
        topImg.style.cssText = "display:block;width:54px;height:54px;object-fit:contain;border-radius:50%;background:#ffffff;padding:3px;margin:0 auto 6px;box-shadow:0 2px 6px rgba(0,0,0,.25);";
        h1.insertAdjacentElement("beforebegin", topImg);
      }
    }
  }

  syncBrandLogo();
  setTimeout(syncBrandLogo, 150);

  // ৩. সেটিংসের ভেতরে লোগো, নাম ও ঠিকানা সেভ করার বক্স (কোনো কাঁপাকাঁপি ছাড়াই)
  document.addEventListener("click", function(e) {
    if ((e.target.textContent || "").includes("সেটিংস")) {
      setTimeout(function() {
        const dlg = document.getElementById("dlg");
        if (!dlg || !dlg.open || document.getElementById("nhsLogoUploadBox")) return;
        const h2 = dlg.querySelector("h2");
        if (!h2) return;
        const box = document.createElement("div");
        box.id = "nhsLogoUploadBox";
        box.style.cssText = "margin:10px 0;padding:10px;background:#f0fdf4;border:1.5px solid #0a6b6b;border-radius:10px;display:grid;gap:7px;font-size:.85rem;color:#0f172a;";
        box.innerHTML = `
          <div style="font-weight:700;color:#064e4e;">🏛️ প্রতিষ্ঠানের লোগো, নাম ও ঠিকানা সেটআপ</div>
          <label style="font-weight:600;">🖼️ প্রতিষ্ঠানের লোগো আপলোড করুন:
            <input id="nhsDirectLogoInp" type="file" accept="image/*" style="display:block;margin-top:4px;">
          </label>
          <input id="nhsDirectNameInp" type="text" value="${esc(localStorage.getItem("nhs_custom_org_name") || "")}" placeholder="প্রতিষ্ঠানের নাম (বদলাতে চাইলে লিখুন)..." style="padding:7px;border:1px solid #94a3b8;border-radius:7px;">
          <input id="nhsDirectAddrInp" type="text" value="${esc(localStorage.getItem("nhs_custom_org_addr") || "")}" placeholder="প্রতিষ্ঠানের ঠিকানা লিখুন..." style="padding:7px;border:1px solid #94a3b8;border-radius:7px;">
          <button type="button" id="nhsDirectSaveBtn" style="background:#0a6b6b;color:#fff;border:none;padding:8px;border-radius:8px;font-weight:700;cursor:pointer;">💾 লোগো ও তথ্য সেভ করুন</button>
        `;
        h2.insertAdjacentElement("afterend", box);

        document.getElementById("nhsDirectLogoInp").onchange = function(ev) {
          const f = ev.target.files && ev.target.files.at(0);
          if (!f) return;
          const rd = new FileReader();
          rd.onload = () => {
            localStorage.setItem("nhs_custom_org_logo", rd.result);
            syncBrandLogo();
            alert("প্রতিষ্ঠানের লোগো সফলভাবে যুক্ত হয়েছে! পরের বার অ্যাপ খুললেই ওয়েলকাম পর্দায় লোগো দেখাবে।");
          };
          rd.readAsDataURL(f);
        };

        document.getElementById("nhsDirectSaveBtn").onclick = function() {
          const nm = document.getElementById("nhsDirectNameInp").value.trim();
          const ad = document.getElementById("nhsDirectAddrInp").value.trim();
          if (nm) localStorage.setItem("nhs_custom_org_name", nm);
          if (ad) localStorage.setItem("nhs_custom_org_addr", ad);
          syncBrandLogo();
          alert("প্রতিষ্ঠানের নাম, ঠিকানা ও লোগো সংরক্ষিত হয়েছে!");
        };
      }, 150);
    }
  });
})();
</script>
<script>
(function(){
  if (new URLSearchParams(location.search).get("member") || new URLSearchParams(location.search).get("voter") === "1") return;

  // ১. আগের সব বাড়তি বাটন ও সাদা খালি ঘর পরিষ্কার করা (মূল অ্যাপের আসল রঙ অপরিবর্তিত রেখে)
  ["nhsSmartThemeStyle","nhsThemeBar","nhsMoreDrawer","nhsMoreMenuBtn","nhsCleanToolsBox","nhsCleanToolsBtn","nhsCompactMenuBtn","nhsCompactMenuBox","nhsNeatToggleBtn"].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.remove();
  });

  setTimeout(function() {
    const hdr = document.querySelector("header, .topbar, .hdr");
    if (!hdr) return;

    // আগের সরানো অংশ থাকলে তা আগে জায়গামতো ফিরিয়ে আনা
    const oldPanel = document.getElementById("nhsSingleMenuPanel");
    if (oldPanel) {
      while (oldPanel.firstChild) oldPanel.parentNode.insertBefore(oldPanel.firstChild, oldPanel);
      oldPanel.remove();
    }
    const oldBtn = document.getElementById("nhsSingleMenuBtn");
    if (oldBtn) oldBtn.remove();

    // সার্চ বক্স খুঁজে বের করা
    const searchInp = Array.from(hdr.querySelectorAll("input")).find(i => (i.placeholder || "").includes("খুঁজুন") || (i.placeholder || "").includes("নাম"));
    if (!searchInp) return;

    // সার্চ বক্সের সারি পর্যন্ত রেখে নিচের সব অংশ ১টি মেনু বাটনের ভেতরে রাখা
    let searchContainer = searchInp;
    while (searchContainer.parentElement && searchContainer.parentElement !== hdr) {
      searchContainer = searchContainer.parentElement;
    }

    const belowItems = [];
    let nxt = searchContainer.nextElementSibling;
    while (nxt) {
      belowItems.push(nxt);
      nxt = nxt.nextElementSibling;
    }

    if (belowItems.length > 0) {
      const mBtn = document.createElement("button");
      mBtn.id = "nhsFinalMenuToggle";
      mBtn.type = "button";
      mBtn.style.cssText = "display:block;width:100%;margin-top:8px;padding:7px 12px;background:rgba(255,255,255,0.18);color:#fff;border:1px solid rgba(255,255,255,0.4);border-radius:8px;font-weight:700;font-size:.86rem;cursor:pointer;text-align:center;";
      mBtn.textContent = "☰ মেনু ও ফিল্টার দেখুন ▾";

      const mWrap = document.createElement("div");
      mWrap.id = "nhsFinalMenuWrap";
      mWrap.style.cssText = "display:none;margin-top:8px;";

      belowItems.forEach(el => mWrap.appendChild(el));
      searchContainer.insertAdjacentElement("afterend", mBtn);
      mBtn.insertAdjacentElement("afterend", mWrap);

      mBtn.onclick = function(e) {
        e.preventDefault();
        const isClosed = mWrap.style.display === "none";
        mWrap.style.display = isClosed ? "block" : "none";
        mBtn.textContent = isClosed ? "✕ মেনু বন্ধ করুন ▴" : "☰ মেনু ও ফিল্টার দেখুন ▾";
      };
    }
  }, 200);
})();
</script>
