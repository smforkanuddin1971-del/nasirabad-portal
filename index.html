<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome Screen</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Roboto, "Noto Sans Bengali", sans-serif;
    }

    body {
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f766e 100%);
      color: #ffffff;
    }

    .splash-container {
      position: relative;
      text-align: center;
      padding: 36px 28px;
      max-width: 420px;
      width: 90%;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
      animation: cardEntrance 1.2s ease-out forwards;
    }

    /* প্রতিষ্ঠানের লোগো */
    .logo-wrapper {
      width: 112px;
      height: 112px;
      margin: 0 auto 20px;
      border-radius: 28px;
      background: linear-gradient(145deg, #2dd4bf, #0284c7);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 30px rgba(45, 212, 191, 0.35);
      opacity: 0;
      transform: scale(0.75);
      animation: logoReveal 2.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .logo-placeholder-text {
      font-size: 34px;
      font-weight: 800;
      letter-spacing: 1px;
      color: #ffffff;
    }

    .org-name {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0.4px;
      margin-bottom: 8px;
      opacity: 0;
      animation: fadeUp 2s ease 1s forwards;
    }

    .tagline {
      font-size: 14px;
      color: #cbd5e1;
      margin-bottom: 28px;
      opacity: 0;
      animation: fadeUp 2s ease 1.8s forwards;
    }

    /* ১০ সেকেন্ডের প্রগ্রেস বার */
    .progress-track {
      width: 100%;
      height: 5px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.15);
      overflow: hidden;
      margin-bottom: 24px;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, #2dd4bf, #38bdf8);
      animation: loadTenSec 10s linear forwards;
    }

    /* ডেভেলপার তথ্য */
    .developer-box {
      padding-top: 14px;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      font-size: 13px;
      color: #94a3b8;
      opacity: 0;
      animation: fadeUp 2s ease 2.5s forwards;
    }

    .developer-box strong {
      display: block;
      margin-top: 4px;
      font-size: 15px;
      color: #f8fafc;
      font-weight: 600;
    }

    @keyframes cardEntrance {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes logoReveal {
      0% { opacity: 0; transform: scale(0.75); }
      40% { opacity: 1; transform: scale(1.05); }
      100% { opacity: 1; transform: scale(1); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes loadTenSec {
      from { width: 0%; }
      to { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="splash-container">
    <!-- নিজের লোগো বসাতে নিচের div এর বদলে <img src="logo.png" alt="Logo" /> ব্যবহার করতে পারেন -->
    <div class="logo-wrapper">
      <span class="logo-placeholder-text">LOGO</span>
    </div>

    <h1 class="org-name">প্রতিষ্ঠানের নাম</h1>
    <p class="tagline">স্বাগতম — স্মার্ট ও আধুনিক অভিজ্ঞতা</p>

    <div class="progress-track">
      <div class="progress-fill"></div>
    </div>

    <div class="developer-box">
      ডেভেলপ করেছেন
      <strong>ডেভেলপারের নাম</strong>
    </div>
  </div>

  <script>
    // ১০ সেকেন্ড পর পরবর্তী পেজে নিতে চাইলে নিচের লাইনটি আনকমেন্ট করুন:
  setTimeout(() => {
  window.location.href = "portal.html";
     }, 10000);
  </script>
</body>
</html>
